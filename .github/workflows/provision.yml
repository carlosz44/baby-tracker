name: Provision VPS

on:
  workflow_dispatch:

jobs:
  provision:
    runs-on: ubuntu-latest

    steps:
      - name: Base provision (Docker, firewall, deploy user, backup cron)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: admin
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            sudo -n bash <<'SCRIPT'
            set -euo pipefail
            export DEBIAN_FRONTEND=noninteractive
            command -v docker >/dev/null || curl -fsSL https://get.docker.com | sh
            apt-get install -y -qq fail2ban ufw
            id deploy &>/dev/null || adduser --disabled-password --gecos "" deploy
            usermod -aG docker deploy
            if [ -f /home/admin/.ssh/authorized_keys ] && [ ! -f /home/deploy/.ssh/authorized_keys ]; then
              mkdir -p /home/deploy/.ssh
              cp /home/admin/.ssh/authorized_keys /home/deploy/.ssh/authorized_keys
              chown -R deploy:deploy /home/deploy/.ssh
              chmod 700 /home/deploy/.ssh
              chmod 600 /home/deploy/.ssh/authorized_keys
            fi
            mkdir -p /srv/baby-tracker
            chown deploy:deploy /srv/baby-tracker
            cat > /etc/cron.d/baby-tracker-backup <<'EOF'
            SHELL=/bin/bash
            PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
            0 3 * * * deploy /srv/baby-tracker/backup_db.sh >> /var/log/baby-tracker-backup.log 2>&1
            EOF
            chmod 644 /etc/cron.d/baby-tracker-backup
            touch /var/log/baby-tracker-backup.log
            chown deploy:deploy /var/log/baby-tracker-backup.log
            ufw allow OpenSSH
            ufw allow 80/tcp
            ufw allow 443/tcp
            ufw --force enable
            SCRIPT
