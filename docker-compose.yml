services:
  web:
    build:
      context: .
      target: dev
    command: ./start.sh
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.local
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: babytracker
      POSTGRES_USER: baby
      POSTGRES_PASSWORD: baby
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U baby -d babytracker"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
