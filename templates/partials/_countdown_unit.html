<div class="rounded-lg bg-slate-50 py-3 text-center dark:bg-zinc-700/50">
  <p class="text-3xl font-bold tabular-nums text-rose-500 dark:text-rose-400" data-countdown-value="{{ unit }}">{{ value|stringformat:format }}</p>
  <p class="mt-1 text-xs text-slate-500 dark:text-zinc-400" data-countdown-label="{{ unit }}" data-one="{{ one }}" data-many="{{ many }}">{% if value == 1 %}{{ one }}{% else %}{{ many }}{% endif %}</p>
</div>
